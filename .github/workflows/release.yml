name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make check vuln lint
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update the macOS and Linux Homebrew source formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 0; fi
          python3 scripts/update_homebrew.py "${RELEASE_TAG#v}" dist/checksums.txt /tmp/ssmsh.rb
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B homebrew-update "origin/$DEFAULT_BRANCH"
          cp /tmp/ssmsh.rb ssmsh.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ssmsh.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Homebrew formula for $RELEASE_TAG"
          git push origin "HEAD:$DEFAULT_BRANCH"
